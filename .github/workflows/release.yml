name: Verify and publish Bildblick

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bildblick-release
  cancel-in-progress: false

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.obaidr1.obiview.json
          bundle: Bildblick-0.11.2.flatpak
          artifact-name: bildblick-flatpak

  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install AppImage build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-pip python3-apt libfuse2t64 xvfb xauth dbus-x11 openbox
          python3 -m venv --system-site-packages /tmp/appimage-builder-venv
          /tmp/appimage-builder-venv/bin/pip install 'appimage-builder==1.1.0'
          python3 - <<'PY'
          from pathlib import Path
          package_module = Path('/tmp/appimage-builder-venv/lib/python3.12/site-packages/appimagebuilder/modules/deploy/apt/package.py')
          source = package_module.read_text()
          old = 'return version.parse(self.version) > version.parse(other.version)'
          new = 'return apt_pkg.version_compare(self.version, other.version) > 0'
          if old not in source:
              raise SystemExit('Could not apply Debian package-version comparison patch')
          source = source.replace('from packaging import version', 'import apt_pkg\napt_pkg.init_system()')
          package_module.write_text(source.replace(old, new))
          PY
      - name: Build AppImage
        run: /tmp/appimage-builder-venv/bin/appimage-builder --recipe packaging/appimage/AppImageBuilder.yml --skip-test
      - name: Smoke test the packaged GTK application
        run: |
          set +e
          xvfb-run -a dbus-run-session -- timeout 15s ./Bildblick-0.11.2-x86_64.AppImage
          result=$?
          if [ "$result" -ne 124 ]; then
            echo "AppImage exited before the GUI smoke-test timeout (status $result)."
            exit 1
          fi
          set -e
      - uses: actions/upload-artifact@v4
        with:
          name: bildblick-appimage
          path: Bildblick-0.11.2-x86_64.AppImage

  release:
    runs-on: ubuntu-latest
    container: fedora:44
    needs: [flatpak, appimage]
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Install test and packaging dependencies
        run: >-
          dnf -y install git gh tar gzip python3 python3-gobject python3-cairo
          python3-pillow gtk4 fontconfig ImageMagick poppler-utils ffmpeg-free util-linux
          desktop-file-utils xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon adwaita-icon-theme openbox
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify core and decoder behavior
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Check syntax and desktop entry
        run: |
          /usr/bin/python3 -m compileall -q -x '/\.git/' .
          desktop-file-validate bildblick.desktop
      - name: Audit dialog geometry and expanded content
        env:
          PYTHONPATH: .
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          BILDBLICK_SCREENSHOT_LOG: '1'
        run: xvfb-run -a -s '-screen 0 1440x1050x24' dbus-run-session -- sh -c 'openbox >/tmp/openbox.log 2>&1 & /usr/bin/python3 tests/ui_dialog_audit.py'
      - name: Audit dialogs on a short screen
        env:
          PYTHONPATH: .
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run -a -s '-screen 0 1024x640x24' dbus-run-session -- sh -c 'openbox >/tmp/openbox.log 2>&1 & /usr/bin/python3 tests/ui_dialog_audit.py'
      - name: Verify native GTK workflows and capture UI
        env:
          PYTHONPATH: .
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          BILDBLICK_SCREENSHOT_LOG: '1'
        run: xvfb-run -a -s '-screen 0 1440x1050x24' dbus-run-session -- sh -c 'openbox >/tmp/openbox.log 2>&1 & /usr/bin/python3 tests/ui_smoke.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bildblick-ui
          path: tests/screenshots/
      - uses: actions/download-artifact@v4
        with:
          name: bildblick-flatpak
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: bildblick-appimage
          path: dist/
      - name: Build installable package
        run: /usr/bin/python3 packaging/build.py
      - name: Publish versioned prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          tag=v0.11.2
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; its tag and assets stay unchanged."
          else
            gh release create "$tag" \
              dist/Bildblick-0.11.2.flatpak \
              dist/Bildblick-0.11.2-x86_64.AppImage \
              dist/Bildblick-0.11.2-linux.tar.gz \
              dist/Bildblick-0.11.2-linux.tar.gz.sha256 \
              --target "$RELEASE_COMMIT" --prerelease \
              --title 'Bildblick 0.11.2' \
              --notes-file docs/release-0.11.2.md
          fi
